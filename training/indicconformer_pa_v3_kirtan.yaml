# IndicConformer-pa-large fine-tune on v3 600h Gurbani corpus
# Target hardware: 1× A40 48GB (RunPod spot ~$0.39-0.79/hr)
# Base checkpoint: ai4bharat/indicconformer_stt_pa_hybrid_ctc_rnnt_large (.nemo file)
# Goal: beat surt-small-v3 baseline kirtan WER (57.28%) by ≥5pp.

name: "indicconformer-pa-v3-kirtan"

init_from_nemo_model: /workspace/data/indicconformer_stt_pa_hybrid_rnnt_large.nemo

model:
  sample_rate: 16000
  log_prediction: false      # don't spam logs with every batch's hypothesis
  ctc_reduction: 'mean_volume'
  use_cer: true               # CER is the more reliable metric for Gurmukhi

  # Hybrid CTC-RNNT joint loss — keep AI4Bharat's default ratio.
  aux_ctc:
    ctc_loss_weight: 0.3      # 0.3 CTC + 0.7 RNNT = AI4Bharat default
    use_cer: true
    decoding:
      strategy: "greedy"

  # KEEP existing multilingual aggregate tokenizer from the .nemo file —
  # do NOT replace. Punjabi sub-tokenizer (256 BPE pieces) is what we want.
  tokenizer:
    update_tokenizer: false

  # ---- training data ----
  train_ds:
    manifest_filepath: /workspace/data/manifests/train.jsonl
    sample_rate: 16000
    batch_size: 32                # OOM-safe; CPU-bound at 87% util so bigger batch wouldn't help
    shuffle: true
    num_workers: 32               # 96-vCPU pod; feed GPU (was 12, data-starved) — 9 vCPU pod + 12+4 workers stops thrashing
    pin_memory: true
    persistent_workers: true      # don't respawn workers between epochs
    prefetch_factor: 4            # was default 2 — keep GPU fed
    use_start_end_token: false
    trim_silence: false
    max_duration: 18.0            # cuts attention memory vs 22s
    min_duration: 0.5
    bucketing_strategy: "synced_randomized"   # was fully_randomized — group similar-length clips, kills mem spikes
    bucketing_batch_size: null
    is_tarred: false
    return_language_id: true      # AI4Bharat aggregate tokenizer needs lang per sample

    # ---- HARD on-the-fly waveform augmentation (speed + pitch + noise + RIR) ----
    # speed/gain/white_noise are self-contained (no external data). The runner
    # appends `noise:` (MUSAN) + `impulse:` (RIRS_NOISES) blocks here AFTER it
    # builds those manifests, so this base config never references missing files.
    augmentor:
      speed:                       # resample-based speed+pitch shift — NeMo's native pitch proxy
        prob: 0.6
        sr: 16000
        resample_type: 'kaiser_best'
        min_speed_rate: 0.9
        max_speed_rate: 1.1
        num_rates: 5
      gain:
        prob: 0.3
        min_gain_dbfs: -10.0
        max_gain_dbfs: 10.0
      white_noise:
        prob: 0.3
        min_level: -90
        max_level: -46

  validation_ds:
    manifest_filepath: /workspace/data/manifests/val_kirtan.jsonl
    sample_rate: 16000
    batch_size: 32
    shuffle: false
    num_workers: 4                # was 8
    pin_memory: true
    persistent_workers: true
    return_language_id: true

  test_ds:
    manifest_filepath: /workspace/data/manifests/val_sehajpath.jsonl
    sample_rate: 16000
    batch_size: 32
    shuffle: false
    num_workers: 4                # was 8
    pin_memory: true
    persistent_workers: true
    return_language_id: true

  # ---- SpecAugment — HARD (user: augment hard). Up from freq2/time5 ----
  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 3            # hard (was 2)
    time_masks: 10           # hard — NeMo default (was 5)
    freq_width: 27
    time_width: 0.05         # fraction of seq length

  # ---- optimizer ----
  optim:
    name: adamw
    lr: 1.0e-4               # peak LR; AI4Bharat trained at 5e-4 from scratch — for fine-tune we want 5-10× lower
    betas: [0.9, 0.98]
    weight_decay: 1.0e-3
    sched:
      name: CosineAnnealing
      warmup_steps: 2000
      min_lr: 1.0e-6

trainer:
  devices: 1
  accelerator: gpu
  num_nodes: 1
  max_epochs: 12                 # fallback only; max_steps is the real cap
                                 # v4-clean pool ≈868h unique / ~1420h effective (kirtan x2 + bani)
  max_steps: 50000             # ceiling; early-stop (val 1000, patience 3) ends it at kirtan CER plateau
  accumulate_grad_batches: 2     # effective batch = 128 micro × 2 accum = 256
  gradient_clip_val: 1.0
  precision: bf16-mixed
  log_every_n_steps: 50
  val_check_interval: 1000
  check_val_every_n_epoch: 1     # NeMo can't handle null
  num_sanity_val_steps: 2
  sync_batchnorm: false
  enable_checkpointing: false
  benchmark: true
  logger: false                  # exp_manager creates its own; pl trainer's auto-logger collides

exp_manager:
  exp_dir: /workspace/checkpoints/indicconformer-pa-v3-kirtan
  name: indicconformer-pa-v3-kirtan
  create_tensorboard_logger: true
  create_wandb_logger: false                 # wandb plan expired
  wandb_logger_kwargs:
    project: surt-indicconformer
    name: indicconformer-pa-v3-kirtan
    entity: sabysurinder-surinder
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  # ---- early stop on KIRTAN WER (not loss) — that's what we actually care about ----
  create_early_stopping_callback: true
  early_stopping_callback_params:
    monitor: "val_wer"           # NeMo logs val_wer for the first val dataloader (kirtan)
    mode: "min"
    min_delta: 0.005             # 0.5pp WER improvement to count as progress
    patience: 3                  # 4 evals × 2000 steps = 8000 steps with no improvement → stop
    verbose: true

  # ---- save best 3 by kirtan WER + last ----
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 3
    save_last: true
    always_save_nemo: true       # also write .nemo file (easier deploy)
    filename: "{epoch}-step{step}-kirtan_wer{val_wer:.4f}"
